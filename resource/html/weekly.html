<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 800px;
  font-family: "Source Han Sans SC", "Microsoft YaHei", sans-serif;
  background: #fff6fb;
}
.wrap { width: 800px; padding: 40px; }
.title { font-size: 40px; font-weight: bold; text-align: center; color: #ff6fa5; margin-bottom: 10px; }
.subtitle { font-size: 26px; text-align: center; color: #b06a8c; margin-bottom: 30px; }
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}
.cell {
  background: #fff;
  border-radius: 18px;
  padding: 16px;
  text-align: center;
  box-shadow: 0 4px 12px rgba(255,140,180,.15);
}
.cell img { width: 130px; height: 130px; object-fit: contain; }
.day { font-size: 22px; color: #999; margin-top: 8px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">🐷 本周小猪</div>
    <div class="subtitle">{{subtitle}}</div>
    <div class="grid">
      {{each items item}}
      <div class="cell">
        <img src="{{item.avatar}}" />
        <div class="day">{{item.day}}</div>
      </div>
      {{/each}}
    </div>
  </div>
</body>
</html>
